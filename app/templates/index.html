<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>米家 API 控制台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============ CSS Variables ============ */
      :root {
        --primary: #2196f3;
        --primary-hover: #1976d2;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --bg: #f8fafc;
        --card: #ffffff;
        --card-hover: #f1f5f9;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --text-muted: #94a3b8;
        --border: #e2e8f0;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md:
          0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        --shadow-lg:
          0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        --radius: 12px;
        --radius-sm: 8px;
        --transition: 150ms ease;
      }

      /* ============ Base ============ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        line-height: 1.5;
        min-height: 100vh;
      }

      /* ============ Layout ============ */
      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px;
      }
      /* ============ Cards ============ */
      .card {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border);
        padding: 20px;
        margin-bottom: 20px;
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .card-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-title svg {
        width: 20px;
        height: 20px;
        color: var(--primary);
      }

      /* ============ Tabs ============ */
      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
      }
      .tab {
        padding: 8px 16px;
        border: none;
        background: transparent;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-secondary);
        cursor: pointer;
        border-radius: var(--radius-sm);
        transition: all var(--transition);
      }
      .tab:hover {
        background: var(--bg);
        color: var(--text-primary);
      }
      .tab.active {
        background: var(--primary);
        color: white;
      }

      /* ============ Buttons ============ */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px 16px;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all var(--transition);
      }
      .btn svg {
        width: 16px;
        height: 16px;
      }
      .btn-primary {
        background: var(--primary);
        color: white;
      }
      .btn-primary:hover {
        background: var(--primary-hover);
      }
      .btn-success {
        background: var(--success);
        color: white;
      }
      .btn-success:hover {
        background: #059669;
      }
      .btn-secondary {
        background: var(--bg);
        color: var(--text-primary);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover {
        background: var(--card-hover);
      }
      .btn-danger {
        background: var(--danger);
        color: white;
      }
      .btn-danger:hover {
        background: #dc2626;
      }
      .btn-sm {
        padding: 6px 12px;
        font-size: 13px;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .btn-icon {
        padding: 8px;
      }

      /* ============ Auth Section ============ */
      .auth-card {
        padding: 24px;
      }
      .auth-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .auth-avatar {
        width: 48px;
        height: 48px;
        background: linear-gradient(135deg, var(--primary), #60a5fa);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .auth-avatar svg {
        width: 24px;
        height: 24px;
        color: white;
      }
      .auth-details h3 {
        font-size: 16px;
        font-weight: 600;
      }
      .auth-details p {
        font-size: 13px;
        color: var(--text-secondary);
      }
      .qr-section {
        text-align: center;
        padding: 24px;
        background: var(--bg);
        border-radius: var(--radius-sm);
        margin-top: 16px;
      }
      .qr-section img {
        border: 4px solid white;
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-md);
      }
      .qr-section p {
        margin-top: 12px;
        color: var(--text-secondary);
        font-size: 14px;
      }

      /* ============ Devices Grid ============ */
      .devices-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }

      .device-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        cursor: pointer;
        transition: all var(--transition);
      }
      .device-card:hover {
        border-color: var(--primary);
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
      }
      .device-card.offline {
        opacity: 0.7;
      }

      .device-header {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 12px;
      }
      .device-icon {
        width: 44px;
        height: 44px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .device-icon svg {
        width: 24px;
        height: 24px;
        color: white;
      }
      .device-icon.light {
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
      }
      .device-icon.camera {
        background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      }
      .device-icon.sensor {
        background: linear-gradient(135deg, #10b981, #059669);
      }
      .device-icon.switch {
        background: linear-gradient(135deg, #3b82f6, #2563eb);
      }
      .device-icon.vacuum {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
      }
      .device-icon.default {
        background: linear-gradient(135deg, #64748b, #475569);
      }

      .device-info {
        flex: 1;
        min-width: 0;
      }
      .device-name {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .device-model {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .device-status {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
      }
      .device-status-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 500;
      }
      .device-status-badge.online {
        background: #d1fae5;
        color: #059669;
      }
      .device-status-badge.offline {
        background: #f1f5f9;
        color: #64748b;
      }
      .device-status-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
      }
      .device-status-badge.online .device-status-dot {
        background: #10b981;
      }
      .device-status-badge.offline .device-status-dot {
        background: #94a3b8;
      }

      /* ============ Scenes/Automations List ============ */
      .list-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: var(--bg);
        border-radius: var(--radius-sm);
        margin-bottom: 8px;
      }
      .list-item:last-child {
        margin-bottom: 0;
      }
      .list-item-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .list-item-icon {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .list-item-icon svg {
        width: 18px;
        height: 18px;
        color: white;
      }
      .list-item-icon.scene {
        background: linear-gradient(135deg, #f59e0b, #d97706);
      }
      .list-item-icon.automation {
        background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      }
      .list-item-icon.enabled {
        background: linear-gradient(135deg, #10b981, #059669);
      }
      .list-item-icon.disabled {
        background: linear-gradient(135deg, #64748b, #475569);
      }
      .list-item-name {
        font-size: 14px;
        font-weight: 500;
      }
      .list-item-meta {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .list-item-actions {
        display: flex;
        gap: 8px;
      }

      /* ============ Detail Modal ============ */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        opacity: 0;
        visibility: hidden;
        transition: all 200ms ease;
      }
      .modal-overlay.active {
        opacity: 1;
        visibility: visible;
      }

      .modal {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        width: 90%;
        max-width: 600px;
        max-height: 90vh;
        overflow: hidden;
        transform: scale(0.95) translateY(10px);
        transition: all 200ms ease;
      }
      .modal-overlay.active .modal {
        transform: scale(1) translateY(0);
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }
      .modal-title {
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .modal-close {
        width: 32px;
        height: 32px;
        border: none;
        background: var(--bg);
        border-radius: var(--radius-sm);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition);
      }
      .modal-close:hover {
        background: var(--border);
      }
      .modal-close svg {
        width: 18px;
        height: 18px;
        color: var(--text-secondary);
      }

      .modal-body {
        padding: 20px;
        max-height: 70vh;
        overflow-y: auto;
      }

      .detail-section {
        margin-bottom: 20px;
      }
      .detail-section:last-child {
        margin-bottom: 0;
      }
      .detail-section-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .detail-item {
        background: var(--bg);
        padding: 10px 12px;
        border-radius: var(--radius-sm);
      }
      .detail-item-label {
        font-size: 11px;
        color: var(--text-muted);
      }
      .detail-item-value {
        font-size: 14px;
        font-weight: 500;
        margin-top: 2px;
        word-break: break-all;
      }

      /* ============ Properties ============ */
      .property-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        background: var(--bg);
        border-radius: var(--radius-sm);
        margin-bottom: 8px;
      }
      .property-item:last-child {
        margin-bottom: 0;
      }
      .property-name {
        font-size: 13px;
        font-weight: 500;
      }
      .property-value {
        font-size: 13px;
        color: var(--text-secondary);
      }

      .property-toggle {
        position: relative;
        width: 44px;
        height: 24px;
        background: var(--border);
        border-radius: 12px;
        cursor: pointer;
        transition: all var(--transition);
      }
      .property-toggle.active {
        background: var(--success);
      }
      .property-toggle::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        top: 2px;
        left: 2px;
        transition: all var(--transition);
        box-shadow: var(--shadow-sm);
      }
      .property-toggle.active::after {
        left: 22px;
      }

      /* ============ Actions ============ */
      .action-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .action-btn {
        padding: 8px 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 13px;
        cursor: pointer;
        transition: all var(--transition);
      }
      .action-btn:hover {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }
      .action-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* ============ Toast ============ */
      .toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .toast {
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 500;
        box-shadow: var(--shadow-lg);
        animation: slideIn 200ms ease;
      }
      @keyframes slideIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      .toast.success {
        background: var(--success);
        color: white;
      }
      .toast.error {
        background: var(--danger);
        color: white;
      }
      .toast.info {
        background: var(--primary);
        color: white;
      }

      /* ============ Loading Skeleton ============ */
      .skeleton {
        background: linear-gradient(
          90deg,
          var(--bg) 25%,
          var(--card-hover) 50%,
          var(--bg) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: var(--radius-sm);
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      .skeleton-card {
        height: 120px;
      }

      /* ============ States ============ */
      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-secondary);
      }
      .empty-state svg {
        width: 48px;
        height: 48px;
        color: var(--text-muted);
        margin-bottom: 12px;
      }
      .empty-state p {
        font-size: 14px;
      }

      .loading-state {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        color: var(--text-secondary);
      }
      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 10px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .hidden {
        display: none !important;
      }

      /* ============ Responsive ============ */
      @media (max-width: 640px) {
        .container {
          padding: 16px;
        }
        .header {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
        .devices-grid {
          grid-template-columns: 1fr;
        }
        .detail-grid {
          grid-template-columns: 1fr;
        }
        .modal {
          width: 95%;
          max-height: 85vh;
        }
        .tabs {
          overflow-x: auto;
        }
        .tab {
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1>米家 API 控制台</h1>
      </div>

      <!-- Auth Section -->
      <div class="card auth-card">
        <div class="auth-info">
          <div class="auth-avatar">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"
              />
            </svg>
          </div>
          <div class="auth-details">
            <h3 id="authTitle">检查中...</h3>
            <p id="authMessage">正在获取认证状态</p>
          </div>
          <span class="status-badge" id="authBadge"></span>
        </div>

        <div id="qrSection" class="qr-section hidden">
          <img id="qrImage" src="" alt="登录二维码" />
          <p>请使用米家 App 扫描二维码</p>
          <button class="btn btn-danger btn-sm" onclick="cancelLogin()">
            取消
          </button>
        </div>

        <div id="loginSection" style="margin-top: 16px">
          <button class="btn btn-primary" id="loginBtn" onclick="startLogin()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 013.75 9.375v-4.5zM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 01-1.125-1.125v-4.5zM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0113.5 9.375v-4.5z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6.75 6.75h.75v.75h-.75v-.75zM6.75 16.5h.75v.75h-.75v-.75zM16.5 6.75h.75v.75h-.75v-.75zM13.5 13.5h.75v.75h-.75v-.75zM13.5 19.5h.75v.75h-.75v-.75zM19.5 13.5h.75v.75h-.75v-.75zM19.5 19.5h.75v.75h-.75v-.75zM16.5 16.5h.75v.75h-.75v-.75z"
              />
            </svg>
            扫码登录
          </button>
          <button
            class="btn btn-danger hidden"
            id="logoutBtn"
            onclick="logout()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"
              />
            </svg>
            退出登录
          </button>
        </div>
      </div>

      <!-- Devices Section -->
      <div class="card">
        <div class="tabs">
          <button
            class="tab active"
            data-tab="devices"
            onclick="switchTab('devices')"
          >
            设备
          </button>
          <button class="tab" data-tab="scenes" onclick="switchTab('scenes')">
            场景
          </button>
        </div>

        <!-- Devices Tab -->
        <div id="tab-devices">
          <div class="card-header">
            <span class="card-title">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"
                />
              </svg>
              设备列表
            </span>
            <button class="btn btn-secondary btn-sm" onclick="loadDevices()">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"
                />
              </svg>
              刷新
            </button>
          </div>
          <div id="devicesList">
            <div class="loading-state">
              <div class="spinner"></div>
              加载设备中...
            </div>
          </div>
        </div>

        <!-- Scenes Tab -->
        <div id="tab-scenes" class="hidden">
          <div class="card-header">
            <span class="card-title">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"
                />
              </svg>
              场景列表
            </span>
            <button class="btn btn-secondary btn-sm" onclick="loadScenes()">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"
                />
              </svg>
              刷新
            </button>
          </div>
          <div id="scenesList">
            <div class="loading-state">
              <div class="spinner"></div>
              加载场景中...
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Device Detail Modal -->
    <div class="modal-overlay" id="deviceModal" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <span class="modal-title" id="modalDeviceName">
            <span id="modalDeviceIcon"></span>
            设备详情
          </span>
          <button class="modal-close" onclick="closeModal()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Dynamic content -->
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
      // ============ State ============
      let ws = null;
      let currentDevice = null;
      let currentTab = "devices";

      // ============ Icons (SVG) ============
      const icons = {
        light: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 001.5-.189m-1.5.189a6.01 6.01 0 01-1.5-.189m3.75 7.478a12.06 12.06 0 01-4.5 0m3.75 2.383a14.406 14.406 0 01-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 10-7.517 0c.85.493 1.509 1.333 1.509 2.316V18" /></svg>`,
        camera: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5l4.72-4.72a.75.75 0 011.28.53v11.38a.75.75 0 01-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25h-9A2.25 2.25 0 002.25 7.5v9a2.25 2.25 0 002.25 2.25z" /></svg>`,
        sensor: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" /></svg>`,
        switch: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>`,
        vacuum: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`,
        scene: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" /></svg>`,
        automation: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>`,
        default: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 3v1.5M4.5 8.25H3m18 0h-1.5M4.5 12H3m18 0h-1.5m-15 3.75H3m18 0h-1.5M8.25 19.5V21M12 3v1.5m0 15V21m3.75-18v1.5m0 15V21m-9-1.5h10.5a2.25 2.25 0 002.25-2.25V6.75a2.25 2.25 0 00-2.25-2.25H6.75A2.25 2.25 0 004.5 6.75v10.5a2.25 2.25 0 002.25 2.25zm.75-12h9v9h-9v-9z" /></svg>`,
        play: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z" /></svg>`,
        refresh: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>`,
      };

      // ============ Utilities ============
      function getDeviceIcon(model) {
        const m = (model || "").toLowerCase();
        if (m.includes("light") || m.includes("lamp") || m.includes("bulb"))
          return "light";
        if (m.includes("camera") || m.includes("cam")) return "camera";
        if (m.includes("sensor") || m.includes("meter") || m.includes("temp"))
          return "sensor";
        if (m.includes("switch") || m.includes("plug") || m.includes("outlet"))
          return "switch";
        if (m.includes("vacuum") || m.includes("robot")) return "vacuum";
        return "default";
      }

      function getDeviceIconHtml(model, size = "default") {
        const type = getDeviceIcon(model);
        return `<div class="device-icon ${type}">${icons[type]}</div>`;
      }

      function showToast(message, type = "info") {
        const container = document.getElementById("toastContainer");
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      }

      // ============ Tab Switching ============
      function switchTab(tab) {
        currentTab = tab;
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelector(`.tab[data-tab="${tab}"]`)
          .classList.add("active");

        document
          .getElementById("tab-devices")
          .classList.toggle("hidden", tab !== "devices");
        document
          .getElementById("tab-scenes")
          .classList.toggle("hidden", tab !== "scenes");

        // Load data for the tab
        if (tab === "devices") loadDevices();
        else if (tab === "scenes") loadScenes();
      }

      // ============ Auth ============
      async function checkAuth() {
        try {
          const res = await fetch("/api/v1/auth/status");
          const data = await res.json();

          const title = document.getElementById("authTitle");
          const message = document.getElementById("authMessage");
          const badge = document.getElementById("authBadge");
          const loginBtn = document.getElementById("loginBtn");
          const logoutBtn = document.getElementById("logoutBtn");

          if (data.authenticated) {
            title.textContent = data.user_id || "已登录用户";
            message.textContent = "可以管理您的设备";
            badge.className = "status-badge authenticated";
            badge.innerHTML = '<span class="status-dot"></span>已登录';
            loginBtn.classList.add("hidden");
            logoutBtn.classList.remove("hidden");
            loadDevices();
          } else {
            title.textContent = "未登录";
            message.textContent = data.message || "请扫码登录米家账号";
            badge.className = "status-badge unauthenticated";
            badge.innerHTML = '<span class="status-dot"></span>未登录';
            loginBtn.classList.remove("hidden");
            logoutBtn.classList.add("hidden");
            showEmptyState("devicesList", "请先登录以查看设备");
            showEmptyState("scenesList", "请先登录以查看场景");
          }
        } catch (e) {
          console.error("Check auth error:", e);
        }
      }

      async function startLogin() {
        try {
          document.getElementById("qrSection").classList.remove("hidden");
          document.getElementById("loginSection").classList.add("hidden");

          const res = await fetch("/api/v1/auth/login", { method: "POST" });
          const data = await res.json();

          if (data.status === "waiting" && data.qr_image) {
            document.getElementById("qrImage").src =
              "data:image/png;base64," + data.qr_image;
            connectWebSocket();
          } else if (data.status === "success") {
            checkAuth();
          } else if (data.error) {
            showToast("登录错误: " + data.error, "error");
            document.getElementById("qrSection").classList.add("hidden");
            document.getElementById("loginSection").classList.remove("hidden");
          }
        } catch (e) {
          showToast("登录失败: " + e, "error");
          document.getElementById("qrSection").classList.add("hidden");
          document.getElementById("loginSection").classList.remove("hidden");
        }
      }

      function connectWebSocket() {
        ws = new WebSocket(`ws://${location.host}/api/v1/auth/ws/login`);

        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);

          if (data.status === "success") {
            document.getElementById("qrSection").classList.add("hidden");
            document.getElementById("loginSection").classList.remove("hidden");
            showToast("登录成功!", "success");
            checkAuth();
          } else if (data.status === "error") {
            showToast("登录失败: " + data.error, "error");
            document.getElementById("qrSection").classList.add("hidden");
            document.getElementById("loginSection").classList.remove("hidden");
          }
        };

        ws.onclose = () => {
          ws = null;
        };
        ws.onerror = () => {
          ws = null;
        };
      }

      async function cancelLogin() {
        await fetch("/api/v1/auth/login/cancel", { method: "POST" });
        if (ws) {
          ws.close();
          ws = null;
        }
        document.getElementById("qrSection").classList.add("hidden");
        document.getElementById("loginSection").classList.remove("hidden");
      }

      async function logout() {
        await fetch("/api/v1/auth/logout", { method: "POST" });
        showToast("已退出登录", "info");
        checkAuth();
      }

      // ============ Empty State ============
      function showEmptyState(containerId, message) {
        document.getElementById(containerId).innerHTML = `
                <div class="empty-state">
                    ${icons.default}
                    <p>${message}</p>
                </div>
            `;
      }

      // ============ Devices ============
      async function loadDevices() {
        const container = document.getElementById("devicesList");
        container.innerHTML = `
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            `;

        try {
          const res = await fetch("/api/v1/devices/");
          if (!res.ok) throw new Error("Not authenticated");
          const devices = await res.json();

          if (devices.length === 0) {
            showEmptyState("devicesList", "暂无设备");
            return;
          }

          container.innerHTML = `
                    <div class="devices-grid">
                        ${devices
                          .map(
                            (d) => `
                            <div class="device-card ${d.isOnline ? "" : "offline"}" onclick="openDeviceModal('${d.did}')">
                                <div class="device-header">
                                    ${getDeviceIconHtml(d.model)}
                                    <div class="device-info">
                                        <div class="device-name">${d.name || "未知设备"}</div>
                                        <div class="device-model">${d.model || "未知型号"}</div>
                                    </div>
                                </div>
                                <div class="device-status">
                                    <span class="device-status-badge ${d.isOnline ? "online" : "offline"}">
                                        <span class="device-status-dot"></span>
                                        ${d.isOnline ? "在线" : "离线"}
                                    </span>
                                </div>
                            </div>
                        `,
                          )
                          .join("")}
                    </div>
                `;
        } catch (e) {
          showEmptyState("devicesList", "请先登录");
        }
      }

      // ============ Scenes ============
      async function loadScenes() {
        const container = document.getElementById("scenesList");
        container.innerHTML = `
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            `;

        try {
          const res = await fetch("/api/v1/scenes");
          if (!res.ok) throw new Error("Not authenticated");
          const scenes = await res.json();

          if (scenes.length === 0) {
            showEmptyState("scenesList", "暂无场景");
            return;
          }

          container.innerHTML = scenes
            .map(
              (s) => `
                    <div class="list-item">
                        <div class="list-item-info">
                            <div class="list-item-icon scene">${icons.scene}</div>
                            <div>
                                <div class="list-item-name">${s.name || "未知场景"}</div>
                                <div class="list-item-meta">${s.id || s.scene_id || "-"}</div>
                            </div>
                        </div>
                        <div class="list-item-actions">
                            <button class="btn btn-success btn-sm" onclick="runScene('${s.id || s.scene_id}')">
                                ${icons.play} 执行
                            </button>
                        </div>
                    </div>
                `,
            )
            .join("");
        } catch (e) {
          showEmptyState("scenesList", "请先登录");
        }
      }

      async function runScene(sceneId) {
        try {
          const res = await fetch(`/api/v1/scenes/${sceneId}`, {
            method: "POST",
          });
          const data = await res.json();

          if (data.success) {
            showToast("场景执行成功!", "success");
          } else {
            showToast("执行失败: " + (data.error || "未知错误"), "error");
          }
        } catch (e) {
          showToast("执行失败: " + e.message, "error");
        }
      }

      // ============ Modal ============
      function closeModal(event) {
        if (event && event.target !== event.currentTarget) return;
        document.getElementById("deviceModal").classList.remove("active");
        currentDevice = null;
      }

      async function openDeviceModal(did) {
        const modal = document.getElementById("deviceModal");
        const body = document.getElementById("modalBody");

        modal.classList.add("active");
        body.innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    加载中...
                </div>
            `;

        try {
          // Fetch device details and properties in parallel
          const [deviceRes, propsRes, infoRes] = await Promise.all([
            fetch(`/api/v1/devices/${did}`),
            fetch(`/api/v1/devices/${did}/properties`),
            fetch(`/api/v1/devices/${did}/info`),
          ]);

          const device = await deviceRes.json();
          const properties = await propsRes.json();
          let deviceInfo = {};
          try {
            deviceInfo = await infoRes.json();
          } catch (e) {}

          currentDevice = { ...device, properties, deviceInfo };

          document.getElementById("modalDeviceName").innerHTML = `
                    ${getDeviceIconHtml(device.model)}
                    ${device.name || "未知设备"}
                `;

          // Build actions HTML if available
          let actionsHtml = "";
          if (
            deviceInfo &&
            deviceInfo.actions &&
            deviceInfo.actions.length > 0
          ) {
            actionsHtml = `
                        <div class="detail-section">
                            <div class="detail-section-title">设备动作</div>
                            <div class="action-buttons">
                                ${deviceInfo.actions
                                  .map(
                                    (a) => `
                                    <button class="action-btn" onclick="executeAction('${did}', '${a.name}')">
                                        ${a.name} ${a.description ? "(" + a.description + ")" : ""}
                                    </button>
                                `,
                                  )
                                  .join("")}
                            </div>
                        </div>
                    `;
          }

          // Build properties HTML
          let propertiesHtml = "";
          if (Array.isArray(properties) && properties.length > 0) {
            propertiesHtml = properties
              .map(
                (p) => `
                        <div class="property-item">
                            <span class="property-name">
                                ${p.name || p.piid || p.siid + "-" + p.iid}
                                ${p.desc ? '<span style="color:var(--text-muted)"> - ' + p.desc + "</span>" : ""}
                            </span>
                            ${
                              typeof p.value === "boolean"
                                ? `
                                <div class="property-toggle ${p.value ? "active" : ""}" 
                                     onclick="toggleProperty('${did}', '${p.piid || p.iid}', ${!p.value})">
                                </div>
                            `
                                : `
                                <span class="property-value">${String(p.value)}</span>
                            `
                            }
                        </div>
                    `,
              )
              .join("");
          } else {
            propertiesHtml =
              '<div class="empty-state" style="padding: 20px;"><p>暂无属性数据</p></div>';
          }

          body.innerHTML = `
                    <div class="detail-section">
                        <div class="detail-section-title">基本信息</div>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <div class="detail-item-label">设备ID</div>
                                <div class="detail-item-value">${device.did || "-"}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-item-label">型号</div>
                                <div class="detail-item-value">${device.model || "-"}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-item-label">状态</div>
                                <div class="detail-item-value">${device.isOnline ? "在线" : "离线"}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-item-label">IP</div>
                                <div class="detail-item-value">${device.ip || "-"}</div>
                            </div>
                        </div>
                    </div>
                    
                    ${actionsHtml}
                    
                    <div class="detail-section">
                        <div class="detail-section-title">设备属性</div>
                        ${propertiesHtml}
                    </div>
                    
                    <div class="detail-section">
                        <div class="detail-section-title">快捷操作</div>
                        <div class="action-buttons">
                            <button class="action-btn" onclick="refreshProperties('${did}')" ${!device.isOnline ? "disabled" : ""}>
                                ${icons.refresh} 刷新属性
                            </button>
                        </div>
                    </div>
                `;
        } catch (e) {
          body.innerHTML = `
                    <div class="empty-state">
                        <p>加载失败: ${e.message}</p>
                    </div>
                `;
        }
      }

      async function refreshProperties(did) {
        if (!currentDevice) return;
        await openDeviceModal(did);
        showToast("属性已刷新", "success");
      }

      async function toggleProperty(did, propName, value) {
        try {
          const res = await fetch(
            `/api/v1/devices/${did}/properties/${propName}`,
            {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(value),
            },
          );

          if (res.ok) {
            showToast("设置成功", "success");
            await refreshProperties(did);
          } else {
            const err = await res.json();
            showToast("设置失败: " + (err.detail || "未知错误"), "error");
          }
        } catch (e) {
          showToast("设置失败: " + e.message, "error");
        }
      }

      async function executeAction(did, actionName) {
        try {
          const res = await fetch(
            `/api/v1/devices/${did}/actions/${actionName}`,
            { method: "POST" },
          );
          const data = await res.json();

          if (data.success) {
            showToast(`动作 ${actionName} 执行成功!`, "success");
            await refreshProperties(did);
          } else {
            showToast("执行失败: " + (data.error || "未知错误"), "error");
          }
        } catch (e) {
          showToast("执行失败: " + e.message, "error");
        }
      }

      // ============ Init ============
      checkAuth();

      // Keyboard close
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });
    </script>
  </body>
</html>
