[project]
name = "http-mijia-api"
version = "0.1.0"
description = "HTTP API server for Mijia devices"
requires-python = ">=3.10"
dependencies = [
    "mijiaAPI>=3.0.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "qrcode>=7.4.2",
    "Pillow>=10.0.0",
    "jinja2>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
